# Panel servido por Nginx en el servidor de la municipalidad. La API, el
# WebSocket de alertas y las imágenes de evidencia se piden a la misma
# dirección y Nginx las reenvía al backend: no hace falta CORS ni exponer el
# puerto 8000.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Imágenes de evidencia de hasta 4 MB que el agente envía en base64.
    client_max_body_size 8m;

    location /api/v1/ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # El video en vivo (/inference/stream) es una respuesta continua.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /static/ {
        proxy_pass http://backend:8000;
    }

    # Rutas del panel (/dashboard, /cameras...): las resuelve React Router.
    location / {
        try_files $uri /index.html;
    }
}
